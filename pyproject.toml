[project]
name = "paperpods"
version = "0.1.0"
description = "Turn scientific papers into expert-level listenable podcast scripts and audio."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fonttools>=4.54.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "pypdf>=5.0.0",
  "textual>=0.86.0",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
paperpods = "paperpods.cli:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
